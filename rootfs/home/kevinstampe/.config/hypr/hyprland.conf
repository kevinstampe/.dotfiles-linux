#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = hypridle & hyprpaper & hyprlock
exec-once = wl-clip-persist --clipboard regular
exec-once = systemctl --user start hyprpolkitagent

exec-once = [workspace 1] chromium
exec-once = [workspace 10 silent] gtk-launch chrome-faolnafnngnfdaknnbpnkhgohbobgegn-Default.desktop
exec-once = [workspace 11 silent] gtk-launch chrome-ompifgpmddkgmclendfeacglnodjjndh-Default.desktop
exec-once = [workspace 12 silent] lm-studio

exec-once = ~/.config/hypr/autoreload-waybar.sh
exec-once = ~/.config/hypr/monitor-event.sh

exec-once = $HOME/.local/lib/import_env tmux
exec-once = $HOME/.local/lib/import_env system

exec = killall waybar; waybar &
exec = [workspace 13 silent] killall btop; ghostty --class=btop --font-size=16 -e btop

exec = ~/.config/hypr/lid-init.sh
exec = pacman -Qe > ~/dotfiles/installed-packages.txt

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = OZONE_PLATFORM,wayland
#################
### VARIABLES ###
#################
# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(333333ff)
    col.inactive_border = rgba(000000dd)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 3
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
    split_width_multiplier = 0
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
    allow_small_split = true
    mfact = 0.70
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
    background_color = rgba(000000ff)
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us(altgr-intl)
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
  force_zero_scaling = true
  use_nearest_neighbor = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$ctrl = CTRL
$mainMod = SUPER # Sets "Windows" key as main modifier
$secMod = ALT # second modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, exec, hyprctl reload,
bind = $mainMod, B, exec, chromium
bind = $mainMod, R, exec, rider
bind = $ctrl $secMod, Q, exec, hyprlock
bind = , PRINT, exec, hyprshot -m output
bind = $mainMod, PRINT, exec, hyprshot -m active
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod SHIFT, SLASH, layoutmsg, togglesplit

# toggle on-screen keyboard (wvkbd)
bind = $mainMod, O, exec, zsh ~/.config/hypr/osk-toggle.sh
bindl = , XF86Assistant, exec, zsh ~/.config/hypr/osk-toggle.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d 

bind = $mainMod, right, resizeactive, 50 0
bind = $mainMod, left, resizeactive, -50 0
bind = $mainMod, up, resizeactive, 0 -50
bind = $mainMod, down, resizeactive, 0 50

bind = $mainMod SHIFT, right, resizeactive, 200 0
bind = $mainMod SHIFT, left, resizeactive, -200 0
bind = $mainMod SHIFT, up, resizeactive, 0 -200
bind = $mainMod SHIFT, down, resizeactive, 0 200

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, MINUS, workspace, 11
bind = $mainMod, EQUAL, workspace, 12
bind = $mainMod, backslash, workspace, 13

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, MINUS, movetoworkspace, 11
bind = $mainMod SHIFT, EQUAL, movetoworkspace, 12

# Move workspace to other monitor
bind = $mainMod SHIFT, TAB, movecurrentworkspacetomonitor, +1 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s +10%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Clamshell mode configuration
# Trigger when the switch is turning on.
bindl = , switch:Lid Switch, exec, zsh ~/.config/hypr/lid-init.sh

# toggle power profiles
bindl = , XF86Launch4, exec, zsh ~/.config/hypr/power-profile.sh

## could be settings

# toggle kbd backlight
bindl = , XF86KbdLightOnOff, exec, asusctl leds next

# touchpad toggle bind
#bindl = , XF86TouchpadToggle, exec, zsh ~/.config/hypr/touchpad-toggle.sh

# button on the side of the tablet
bindl = , XF86Launch3, exit
# copilot button
#bindl = , XF86Assistant, exec, zsh ~/.config/hypr/magicAI.sh

#fn+space
#bindl = , XF86Launch4, exec, zsh ~/.config/hypr/idk.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# annoying teams sharing popup
windowrule = match:title ^(teams\.cloud\.microsoft is sharing .*)$, opacity 0, border_size 0, no_blur on, no_dim on, no_focus on, no_shadow on, opaque off

# outlook on workspace 10
windowrule = match:class ^(chrome-faolnafnngnfdaknnbpnkhgohbobgegn-Default)$, workspace 10

# teams on workspace 11
windowrule = match:class ^(chrome-ompifgpmddkgmclendfeacglnodjjndh-Default)$, workspace 11

# tidal on workspace 12
windowrule = match:class ^(tidal-hifi)$, workspace 12

# btop
windowrule = match:title ^(btop)$, border_size 0
windowrule = match:title ^(btop)$, monitor eDP-1
windowrule = match:title ^(btop)$, workspace 13

# calculator
windowrule = match:class ^(org.gnome.Calculator)$, float 1

# gsimplecal: float, no anim (calendar-toggle.sh moves it to the top-right)
windowrule = match:class ^(gsimplecal)$, float 1
windowrule = match:class ^(gsimplecal)$, no_anim on

#window size
windowrule {
    name = xwayland-no-minsize
    match:xwayland = 1

    min_size = 1 1
    no_max_size = 1
}

# JetBrains Rider (native Wayland / WLToolkit) popups: Find, Search Everywhere,
# completion. They are empty-title floating toplevels that auto-close on focus
# loss, so moving the mouse out dismisses them. stay_focused keeps them alive.
windowrule {
    name = jetbrains-rider-popups
    match:class = ^(jetbrains-rider)$
    match:title = ^$

    stay_focused = true
}
