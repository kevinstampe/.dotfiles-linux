# Hyprlock                                                          
general {
}

background {
    blur_passes = 0 # 0 disables blurring
    color = rgba(0,0,0,1)
}

input-field {
    monitor =
    size = 500, 100
    outline_thickness = 6
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color5
    check_color = $color5
    inner_color = $color0
    font_color = $color12
    fail_text = $FAIL
    placeholder_text = Password 
    hide_input = false
    fade_on_empty = false    
    position = 0%, 37%
    halign = center
    valign = bottom
    font_family = Adwaita Sans Regular
}

# User
label {
    monitor =
    text = :   $USER
    color = $color12
    font_size = 36

    position = 0%, 46%
    halign = center
    valign = bottom
    font_family = Adwaita Sans Regular
}

# On-screen keyboard toggle (wvkbd)
label {
    monitor =
    text = 󰌌
    color = $color12
    font_size = 48

    position = -40, 40
    halign = right
    valign = bottom
    font_family = Symbols Nerd Font

    onclick = /home/kevinstampe/.config/hypr/osk-toggle.sh
}

label {
    monitor =
    text = $TIME
    color = $color12
    font_size = 144
    position = 0%, 75%
    halign = center
    valign = bottom
    font_family = Adwaita Sans Regular
}
